<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DATA EKOSISTEM JOGJA</title>
  <link rel="icon" href="https://img.icons8.com/color/96/nature.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #e0f7ef, #c6f1ff);
      min-height: 100vh;
      color: #2f4f4f;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      color: white;
      background-color: #007a5e;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .button:hover {
      background-color: #005f47;
      transform: scale(1.05);
    }
    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: #b22222;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://img.icons8.com/color/96/nature.png" alt="Logo Ekosistem Jogja" width="100" />
    <h1>DATA EKOSISTEM JOGJA</h1>
    <p>Klik tombol di bawah, masukkan password untuk membuka tautan data:</p>
    <button class="button" onclick="aksesData()"><i class="fas fa-lock"></i> Akses Data</button>
    <div id="link"></div>
    <p class="footer">⚠️ Data bersifat internal — harap digunakan dengan bijak.</p>
  </div>

  <script>
    function aksesData() {
      var password = prompt("Masukkan password untuk membuka link:");
      var linkDiv = document.getElementById("link");

      if (password === "ekosistem2025") {
        linkDiv.innerHTML = `
          <a class="button" href="https://drive.google.com/drive/folders/1cWDZbud-mRDZ8WQDPx9rU4ooj85lG537?usp=drive_link" target="_blank">
            <i class="fas fa-folder-open"></i> Nasabah Turun di ats 100 juta (18 Agt 2025)
          </a>
        `;
      } else {
        alert("Password salah. Coba lagi!");
      }
    }
  </script>
</body>
</html>
